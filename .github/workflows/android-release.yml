name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties

      - name: Assemble signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Give the release APK a product name
        run: cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/Musungo-${GITHUB_REF_NAME//\//-}.apk"

      - name: Verify APK signature
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          SIGNATURE_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          printf '%s\n' "$SIGNATURE_OUTPUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          if printf '%s\n' "$SIGNATURE_OUTPUT" | grep -qi 'Android Debug'; then
            echo 'The release APK is signed with the debug certificate.' >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/Musungo-*.apk

      - name: Remove release signing files
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties
